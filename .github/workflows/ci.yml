name: 🚀 CI/CD Pipeline

on:
    pull_request:
        branches: [main, dev]
    push:
        branches:
            - main
            - dev
            - 'feat/**'
            - 'fix/**'
            - 'hotfix/**'
            - 'refactor/**'
            - 'docs/**'
            - 'test/**'
            - 'ci/**'
            - 'chore/**'
            - 'perf/**'
            - 'style/**'
            - 'build/**'
            - 'release/**'
            - 'revert/**'
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gate:
        name: 🧭 Gate (avoid duplicate push runs)
        runs-on: ubuntu-latest
        timeout-minutes: 2
        outputs:
            skip_push: ${{ steps.decide.outputs.skip_push }}
        steps:
            - id: decide
              uses: actions/github-script@v7
              with:
                  script: |
                      const eventName = context.eventName;
                      if (eventName !== 'push') {
                        core.setOutput('skip_push', 'false');
                        return;
                      }

                      const { owner, repo } = context.repo;
                      const commit_sha = context.sha;

                      const prs = await github.paginate(
                        github.rest.repos.listPullRequestsAssociatedWithCommit,
                        { owner, repo, commit_sha, per_page: 100 }
                      );

                      const openPrs = prs.filter((pr) => pr.state === 'open');
                      core.info(`Open PRs associated with ${commit_sha}: ${openPrs.length}`);
                      core.setOutput('skip_push', openPrs.length > 0 ? 'true' : 'false');

    lint:
        name: 🎨 Linting
        needs: gate
        if: ${{ !(github.event_name == 'push' && needs.gate.outputs.skip_push == 'true') }}
        uses: ./.github/workflows/lint.yml

    test-frontend:
        name: 🧪 Frontend Tests
        needs: [gate, lint]
        if: ${{ !(github.event_name == 'push' && needs.gate.outputs.skip_push == 'true') }}
        uses: ./.github/workflows/tests-frontend.yml
        with:
            # Run faster on feature branch pushes; run full (E2E) on PRs and on dev/main.
            e2e: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
