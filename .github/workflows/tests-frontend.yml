name: 🧪 Tests E2E Cypress

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: 
      - main
      - develop
      - 'feat/**'
  workflow_dispatch:

jobs:
  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout frontend
        uses: actions/checkout@v4

      - name: 📥 Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fed-api
          path: fed-api
          ref: main

      - name: 🐳 Start backend services
        working-directory: fed-api
        run: |
          cp .env.example .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          docker compose up -d postgres laravel
          sleep 15

      - name: 🗄️ Setup database
        working-directory: fed-api
        run: |
          docker compose exec -T laravel php artisan migrate:fresh --seed --force

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install frontend dependencies
        run: npm ci

      - name: 🔨 Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: 🧪 Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
          browser: chrome
        env:
          CYPRESS_BASE_URL: http://localhost:5173
          CYPRESS_API_URL: http://localhost:8000

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: 🎥 Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        working-directory: fed-api
        run: docker compose down -v